name: Streaming Notifier

on:
  schedule:
    - cron: '0 9 * * 5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          STREAMING_TOKEN: ${{ secrets.STREAMING_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FILTER_YEAR: ${{ secrets.FILTER_YEAR }}
          FILTER_TYPE: ${{ secrets.FILTER_TYPE }}
