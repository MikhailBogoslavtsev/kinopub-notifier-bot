name: KinoPub Notify

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notifier
        env:
          KINOPUB_TOKEN: ${{ secrets.KINOPUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FILTER_YEAR: ${{ secrets.FILTER_YEAR }}
          FILTER_TYPE: ${{ secrets.FILTER_TYPE }}
        run: python main.py
